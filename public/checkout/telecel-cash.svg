<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 52" fill="none" role="img" aria-label="Telecel Cash">
  <title>Telecel Cash</title>
  <rect width="140" height="52" rx="5" fill="#E30613"/>
  <text x="12" y="23" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="-0.02em">Telecel</text>
  <line x1="12" y1="28.5" x2="128" y2="28.5" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1"/>
  <!-- Cash section: handset + Cash label -->
  <g transform="translate(12,32)">
    <rect x="0" y="0" width="11" height="15" rx="2" fill="#FFFFFF"/>
    <rect x="1.6" y="1.7" width="7.8" height="9.6" rx="0.8" fill="#E30613"/>
    <circle cx="5.5" cy="6.4" r="1.7" fill="#22C55E"/>
    <rect x="3.6" y="12.2" width="3.8" height="1.3" rx="0.65" fill="#F87171"/>
    <text x="15" y="11.5" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Cash</text>
  </g>
